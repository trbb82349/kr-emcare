name: 공휴일·야간 진료 데이터 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:

concurrency:
  group: update-workflow   # 응급실 워크플로(update.yml)와 같은 그룹 -> 동시 push 충돌 방지
  cancel-in-progress: false

jobs:
  update-duty:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests

      - name: 공휴일·야간 진료 데이터 수집 (전국 공휴일 + 서울 야간)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python src/collect_duty.py

      - name: 웹사이트 다시 빌드
        run: python src/build_site.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/duty_data.json docs/index.html
          if git diff --staged --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "update(duty): $(date '+%Y-%m-%d')"
          set +e
          git push
          RESULT=$?
          set -e
          if [ $RESULT -ne 0 ]; then
            echo "Push 실패, rebase 후 재시도..."
            git fetch origin main
            git rebase origin/main
            git push
          fi
