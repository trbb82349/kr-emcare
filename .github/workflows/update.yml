name: 자동 업데이트

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:

concurrency:
  group: update-workflow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests

      - name: 데이터 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python src/collect.py

      - name: 웹사이트 빌드
        run: python src/build_site.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json docs/index.html
          if git diff --staged --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "update: $(date '+%Y-%m-%d %H:%M')"
          set +e
          git push
          RESULT=$?
          set -e
          if [ $RESULT -ne 0 ]; then
            echo "Push 실패, rebase 후 재시도..."
            git fetch origin main
            git rebase origin/main
            git push
          fi
